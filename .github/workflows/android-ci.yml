name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: Tests and Sonar Quality Gate
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=release-key.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          EOF

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Instrumented tests need a running Android emulator before Sonar can collect coverage.
      - name: Run instrumented tests and Sonar analysis
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest :app:jacocoTestReport sonar --no-daemon

      - name: Check Sonar Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: build/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
