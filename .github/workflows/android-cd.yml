name: Android CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  distribute:
    name: Build and distribute release APK
    runs-on: ubuntu-latest

    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
      FIREBASE_RELEASE_NOTES: Release from ${{ github.repository }}@${{ github.sha }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks
          cat > keystore.properties <<EOF
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=release-key.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          EOF

      - name: Decode Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 --decode > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Verify distribution configuration
        run: |
          test -s release-key.jks
          test -s keystore.properties
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"
          test -n "$FIREBASE_APP_ID"
          test -n "$FIREBASE_TESTER_GROUPS"
          jq -e '.project_id and .client_email and .private_key' "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify release APK
        run: ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload release APK to Firebase App Distribution
        run: ./gradlew :app:appDistributionUploadRelease --stacktrace --info --no-daemon
